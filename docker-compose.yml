services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aihelper
      POSTGRES_PASSWORD: aihelper
      POSTGRES_DB: aihelper
    ports:
      # 5433 on the host: a local Windows PostgreSQL 17 service occupies 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aihelper"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      AIH_DATABASE_URL: postgresql+asyncpg://aihelper:aihelper@postgres:5432/aihelper
      AIH_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
